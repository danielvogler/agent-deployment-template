[project]
name = "agent-deployment-template"
version = "2.1.0"
description = "Cookiecutter template for Google ADK agent deployment on Vertex AI Agent Engine"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daniel Vogler" }]
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.4.0",
    "pyright>=1.1.0",
    "pre-commit>=3.7.0",
    "commitizen>=3.0.0",
    "cookiecutter>=2.6.0",
    "cruft>=2.15.0",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = ["hooks"]

[tool.commitizen]
name = "cz_conventional_commits"
version_scheme = "semver"
tag_format = "v$version"
# Read and write [project].version rather than carrying a second copy here. Without a
# provider, `cz bump` has no source of truth -- which is how this repo ended up with a
# CHANGELOG naming 1.1.0, a pyproject saying 0.1.0, and no tags at all.
version_provider = "pep621"
update_changelog_on_bump = true
changelog_incremental = true
