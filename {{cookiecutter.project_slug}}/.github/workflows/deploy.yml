name: Deploy

on:
  # Deploy only after CI has passed on the pushed commit. A plain `push` trigger
  # runs in parallel with ci.yml and deploys commits that fail lint or tests.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "prod"
        type: choice
        options:
          - dev
          - prod
      ref:
        description: "Git ref to deploy (tag, branch, or SHA). Defaults to the triggering ref — set this to roll back to a previous release."
        required: false
        default: ""
        type: string

# Nothing here writes through GITHUB_TOKEN: the GCP credential is a secret, not OIDC.
# Moving this workflow to Workload Identity Federation means adding `id-token: write`
# here -- without it, google-github-actions/auth fails to mint a token.
permissions:
  contents: read

jobs:
  still-current:
    name: Check the commit is still the tip of main
    # workflow_run fires on every CI completion, failed ones and pull requests included.
    if: "{% raw %}${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}{% endraw %}"
    runs-on: ubuntu-latest
    outputs:
      deploy: "{% raw %}${{ steps.tip.outputs.deploy }}{% endraw %}"
    steps:
      # Re-running an old CI run, or two runs finishing out of order, would otherwise
      # deploy an older commit over a newer one. A superseded commit is skipped: the
      # newer commit's own CI run deploys it.
      - id: tip
        env:
          GH_TOKEN: "{% raw %}${{ github.token }}{% endraw %}"
          TESTED_SHA: "{% raw %}${{ github.event.workflow_run.head_sha }}{% endraw %}"
        run: |
          if [ "{% raw %}${{ github.event_name }}{% endraw %}" = "workflow_dispatch" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          main_sha="$(gh api "repos/{% raw %}${{ github.repository }}{% endraw %}/commits/main" --jq .sha)"
          if [ "$main_sha" = "$TESTED_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping deploy of $TESTED_SHA: main has moved on to $main_sha."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy to Agent Engine
    needs: still-current
    if: "{% raw %}${{ needs.still-current.outputs.deploy == 'true' }}{% endraw %}"
    runs-on: ubuntu-latest
    environment: "{% raw %}${{ github.event.inputs.environment || 'prod' }}{% endraw %}"
    # One deploy per environment at a time, queued rather than cancelled mid-upload.
    concurrency:
      group: "deploy-{% raw %}${{ github.event.inputs.environment || 'prod' }}{% endraw %}"
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "{% raw %}${{ github.event.inputs.ref || github.event.workflow_run.head_sha || github.sha }}{% endraw %}"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "{% raw %}${{ secrets.GCP_SA_KEY }}{% endraw %}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "{{cookiecutter.python_version}}"

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          ignore-nothing-to-cache: true

      - run: uv sync

      - name: Deploy
        run: uv run python deployment/deploy.py --env {% raw %}${{ github.event.inputs.environment || 'prod' }}{% endraw %}
        env:
          GOOGLE_CLOUD_PROJECT: "{% raw %}${{ secrets.GOOGLE_CLOUD_PROJECT }}{% endraw %}"
          GOOGLE_CLOUD_LOCATION: "{% raw %}${{ vars.GOOGLE_CLOUD_LOCATION }}{% endraw %}"
          GCS_STAGING_BUCKET: "{% raw %}${{ vars.GCS_STAGING_BUCKET }}{% endraw %}"
          AGENT_ENGINE_RESOURCE_NAME: "{% raw %}${{ vars.AGENT_ENGINE_RESOURCE_NAME }}{% endraw %}"
          AGENT_ENGINE_SERVICE_ACCOUNT: "{% raw %}${{ vars.AGENT_ENGINE_SERVICE_ACCOUNT }}{% endraw %}"
          MODEL_PROVIDER: "{% raw %}${{ vars.MODEL_PROVIDER || 'google' }}{% endraw %}"

      - name: Health check
        run: |
          export AGENT_ENGINE_RESOURCE_NAME="$(cat .agent_engine_resource)"
          uv run python deployment/scripts/health_check.py
        env:
          GOOGLE_CLOUD_PROJECT: "{% raw %}${{ secrets.GOOGLE_CLOUD_PROJECT }}{% endraw %}"
          GOOGLE_CLOUD_LOCATION: "{% raw %}${{ vars.GOOGLE_CLOUD_LOCATION }}{% endraw %}"
          GCS_STAGING_BUCKET: "{% raw %}${{ vars.GCS_STAGING_BUCKET }}{% endraw %}"

      - name: Write deployment summary
        if: success()
        run: |
          echo "## Deployment successful" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Environment:** {% raw %}${{ github.event.inputs.environment || 'prod' }}{% endraw %}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Ref:** {% raw %}${{ github.event.inputs.ref || github.event.workflow_run.head_sha || github.sha }}{% endraw %}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Resource:**" >> "$GITHUB_STEP_SUMMARY"
          cat .agent_engine_resource >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "N/A" >> "$GITHUB_STEP_SUMMARY"
