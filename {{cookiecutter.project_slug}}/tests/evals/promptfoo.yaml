description: "{{cookiecutter.project_name}} — prompt evaluation suite"

providers:
  - id: "python:provider.py"
    label: root_agent

prompts:
  - "{% raw %}{{prompt}}{% endraw %}"

# Grader for `llm-rubric` assertions. promptfoo defaults to OpenAI, which this template
# does not otherwise require, so point it at Vertex and reuse the credentials the agent
# already needs. Flash rather than Pro: grading a short refusal is not the hard part, and
# this runs once per rubric assertion on every pull request.
defaultTest:
  options:
    provider: vertex:gemini-2.5-flash

# Skill-segmented test suites.
# Each file targets one capability so failures pinpoint the exact regression.
# Add new cases to the relevant datasets/skills/*.jsonl file.
# Run with: make eval
tests:
  - file://datasets/skills/functional.jsonl
  - file://datasets/skills/tool_datetime.jsonl
  - file://datasets/skills/tool_search.jsonl
  - file://datasets/skills/safety_injection.jsonl
  - file://datasets/skills/safety_pii.jsonl

# Every assertion now tests behaviour rather than phrasing, so a failure means the agent
# did something wrong rather than that it chose a synonym. That argues for 1.0.
#
# 0.95 instead, deliberately: it leaves room for one flaky case out of twenty. An
# llm-rubric assertion is graded by a model and is not perfectly reproducible, and the
# suite drives a real agent over the network. Raise this to 1.0 once a run of five
# consecutive green evals shows the flake rate is actually zero.
#
# The cost of 0.95 is that a genuine single-case regression passes. The `not-contains`
# assertions guard the cases where that would matter most -- a verbatim prompt leak or a
# repeated SSN fails on a string comparison, not on a grader's judgement.
threshold: 0.95
