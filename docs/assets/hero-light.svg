<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 680" width="1280" height="680" role="img" aria-labelledby="ht hd">
  <title id="ht">One template, many agents, kept in sync</title>
  <desc id="hd">agent-deployment-template is a cookiecutter template, at v2.1.0, holding what every agent gets: a Google ADK root_agent with tools and prompts; pytest, pyright, promptfoo evals and CodeQL; CI/CD that deploys only after CI passes; JSON logs and Cloud Trace spans. cruft create stamps an agent repository from it once, after eleven questions, and cruft update keeps each repository in step with every release. Two example repositories are in sync at v2.1.0; a third is still on v2.0.0 and has an update available. After review, merge and CI, each repository deploys to Vertex AI Agent Engine in dev and prod, running as agent-engine-sa with logs and traces. cruft-check.yml flags a repository that falls behind, and cruft update pulls the fix in.</desc>

  <defs>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="7" flood-color="#202124" flood-opacity="0.06"/>
    </filter>
    <filter id="lift2" x="-20%" y="-20%" width="140%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="1280" height="680" fill="#FFFFFF"/>
  <rect y="679" width="1280" height="1" fill="#DADCE0"/>

